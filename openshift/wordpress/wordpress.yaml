apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: docker.io/bitnami/wordpress:6.8
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: wordpress-db-secret
          env:
            - name: WORDPRESS_DATABASE_HOST
              value: mariadb
            - name: WORDPRESS_DATABASE_PORT_NUMBER
              value: "3306"
            - name: WORDPRESS_DATABASE_NAME
              value: bitnami_wordpress
            - name: WORDPRESS_DATABASE_USER
              value: bn_wordpress
          volumeMounts:
            - name: wordpress-data
              mountPath: /bitnami/wordpress
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-data

---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
spec:
  selector:
    app: wordpress
  ports:
    - name: http
      port: 8080
      targetPort: 8080
